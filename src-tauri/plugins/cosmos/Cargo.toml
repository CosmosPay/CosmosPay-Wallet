[package]
name = "tauri-plugin-cosmos"
version = "0.1.0"
description = "Cosmos Pay's own native surface: a biometrically-bound secure store and the mobile share sheet."
edition = "2021"
rust-version = "1.77.2"
# Required for a plugin with a mobile half: the Tauri CLI keys the generated Android
# module and Swift package off this name.
links = "tauri-plugin-cosmos"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
