name: Release (extension + apps)

# Auto-versioned, packaged releases: the two browser extensions and the phone binaries.
#
# On every push to main/dev this:
#   0. Runs the full test suite + a dependency security audit (`verify` job). The
#      release job `needs` it, so the bot only versions/publishes when every test
#      passes AND there are no known-vulnerable production dependencies.
#   1. Reads the pushed commits and picks a semver bump (Conventional Commits:
#      feat -> minor, fix/anything -> patch, `!:` or `BREAKING CHANGE` -> major).
#   2. Bumps the version accordingly (package.json is the single source of truth;
#      build-extension.ts copies it into the manifest).
#        - main: stable version X.Y.Z, committed back to the repo + tagged.
#        - dev:  prerelease X.Y.Z-dev.<run_number> (NOT committed — ephemeral).
#   3. Builds both the Chrome and Firefox MV3 extensions.
#   4. Zips each one (manifest at the zip root, ready to load/upload).
#   5. Publishes a GitHub Release with the .zip files attached, so testers just
#      download the package and load it — no build step on their side.
#   6. Runs .github/workflows/native.yml against the tag it just pushed and appends the
#      Android and iOS binaries to that same release.
#
# Step 6 runs AFTER the release is published rather than gating it, so the release exists
# with its extensions for the few minutes the native builds take. That order is deliberate:
# the extension zips are the artifact people wait on, and blocking them behind a macOS
# toolchain hiccup would trade a complete release for no release at all. The native job is
# still required to be green — it just fails loudly next to a published release instead of
# silently withholding one.
#
# The bump commit on main carries `[skip ci]`, which GitHub honours to avoid an
# infinite release loop.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Queue runs on the same branch (do NOT cancel): each push must produce its own
# version + release, and cancelling mid-push/tag could leave a partial release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # commit the bump (main), push tags, create releases

jobs:
  # Gate: the bot only proceeds to version/publish if the whole suite is green and
  # there are no known-vulnerable shipped dependencies.
  verify:
    name: Tests & security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # TypeScript + Astro diagnostics (must be 0 errors).
      - name: Typecheck
        run: npm run check

      # The pure modules: the AES-GCM/PBKDF2 vault, the signing guard, the response
      # contracts, the failed-password ladder, the screen table, the i18n key coverage.
      # This job's header called itself "the full test suite" while skipping the only
      # suite that covers the crypto — so a release could ship with the vault broken and
      # every gate green, because e2e and responsive both pass on a wallet that cannot
      # decrypt anything it did not just create.
      - name: Unit tests
        run: npm run test:unit

      # Zero-tolerance on *shipped* deps: --omit=dev audits only runtime deps (what
      # actually ends up in the extension) and --audit-level=low fails on ANY advisory
      # of low severity or higher — not even low-risk vulnerabilities are allowed.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=low

      # AMO's own validator, run before the release rather than after the upload.
      #
      # Every check here fails in exactly one place otherwise: a submission form, days
      # later, with a version already tagged and published. That is how
      # "The `data_collection_permissions` property is missing" was found — a manifest key
      # Mozilla made mandatory in November 2025, which nothing in this repo could have
      # noticed on its own. `--warnings-as-errors` is deliberately NOT set: the build
      # carries a known, documented warning (that key needs Firefox 140 while
      # `strict_min_version` is 121, so older releases simply ignore it) and failing on
      # warnings would mean deleting the key to get green.
      - name: Build extensions
        run: npm run build && npm run build:ext && npm run build:ext:firefox

      # Firefox build only. `addons-linter` validates against Gecko's schema, so the
      # Chrome build's `sidePanel` permission and `side_panel` key would be reported as
      # unknown — noise about keys that are correct for the store they ship to.
      - name: Validate the Firefox extension (addons-linter)
        run: npx --yes addons-linter@latest dist/extension-firefox

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Serve dist in background
        run: |
          npm run serve:dist &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4321 >/dev/null; do sleep 1; done'

      # Security-critical path: SEP-5 derivation, AES-GCM vault, unlock/decrypt.
      - name: E2E wallet smoke test
        run: npm run test:e2e
        env:
          E2E_URL: http://127.0.0.1:4321

      # Device adaptation: no overflow + fluid scaling across phone/tablet/desktop.
      - name: Responsive layout test
        run: npm run test:responsive
        env:
          E2E_URL: http://127.0.0.1:4321

  release:
    name: Version, package & release
    needs: verify # only runs if the tests + security audit above passed
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the `native` job below, which has to stamp the same number into the APK
      # and the .ipa. It cannot read it off the checkout: on `dev` the bump is never committed.
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: needed to diff the pushed commit range
          fetch-tags: true # git-cliff needs prior tags to scope "since last release"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ---- 1. Decide the semver bump from every commit since the last STABLE release ----
      #
      # NOT from the pushed range, which is what this used to read. `before..after` is a
      # single push, so a push carrying a `feat:` chose minor and the next push carrying only
      # fixes chose patch — off the same base. That is how v1.4.0-dev.47 was followed, four
      # hours later, by v1.3.1-dev.48.
      #
      # The range that answers "what will the next release contain?" is everything since the
      # last stable tag. It does not change its mind because the newest push happens to be a
      # typo fix, and it is the same range git-cliff already uses for the changelog.
      - name: Determine version bump
        id: bump
        run: |
          set -euo pipefail
          # Stable tags only (vX.Y.Z, no prerelease), so `sort -V` never has to rank a
          # `-dev.N` suffix — which it does not do the way semver says.
          LAST=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$LAST" ] && git cat-file -e "${LAST}^{commit}" 2>/dev/null; then
            RANGE="${LAST}..HEAD"
          else
            RANGE="HEAD" # nothing released yet, so the whole history is unreleased
          fi
          echo "Analysing $RANGE"
          MSGS="$(git log --format=%B "$RANGE")"
          if echo "$MSGS" | grep -qE '(^|[[:space:]])BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then
            BUMP=major
          elif echo "$MSGS" | grep -qiE '^feat(\(.+\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "Selected bump: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      # ---- 2. Compute the new version (writes package.json in the workspace) ----
      #
      # Derived from the TAGS, never from package.json. package.json is branch-local and the
      # release commit only ever lands on `main`, so dev's copy froze at 1.3.0 while main
      # moved to 1.4.1 — and a patch bump off that stale base published v1.3.1-dev.55 the day
      # after v1.4.1. scripts/release-version.ts carries the full reasoning and the rules.
      #
      # It REFUSES if what it built does not sort above every existing tag, so a regression
      # stops the pipeline rather than reaching a release nobody can un-publish.
      #
      # `npm version` rather than `npm pkg set`: it writes package-lock.json too, and the
      # main-only commit step below stages both.
      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "dev" ]; then
            VERSION=$(git tag -l | node --disable-warning=ExperimentalWarning --experimental-strip-types \
              scripts/release-version.ts "${{ steps.bump.outputs.bump }}" dev "${{ github.run_number }}")
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(git tag -l | node --disable-warning=ExperimentalWarning --experimental-strip-types \
              scripts/release-version.ts "${{ steps.bump.outputs.bump }}" stable)
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          npm version --no-git-tag-version --allow-same-version "$VERSION" >/dev/null
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ---- 2b. Changelog from Conventional Commits (git-cliff) ----
      # Runs BEFORE tagging so `--unreleased` scopes to commits since the last STABLE
      # release (dev prereleases are ignored via cliff.toml). npx uses the existing
      # Node toolchain — no extra project dependency.
      - name: Generate release notes
        run: |
          V="v${{ steps.ver.outputs.version }}"
          # This release's entries only (no header/footer) -> GitHub Release body.
          npx --yes git-cliff@2 --tag "$V" --unreleased --strip all --output RELEASE_NOTES.md
          # Keep the unpacked-install instructions below the change list.
          cat >> RELEASE_NOTES.md <<'MD'

          ---
          **Browser extension (unsigned / unpacked):**
          - **Chrome / Edge:** download `cosmos-pay-chrome-v${{ steps.ver.outputs.version }}.zip`, unzip it, then open `chrome://extensions` → enable *Developer mode* → *Load unpacked* → pick the folder.
          - **Firefox:** download `cosmos-pay-firefox-v${{ steps.ver.outputs.version }}.zip`, then open `about:debugging` → *This Firefox* → *Load Temporary Add-on* → pick the `manifest.json` inside the zip.

          The .zip is also ready to upload as-is to the Chrome Web Store / Firefox AMO.

          **Desktop apps** (attached a few minutes after this release is published — the native builds run once the tag exists). All unsigned, so the OS will warn on first launch:
          - **Windows:** `cosmos-pay-v${{ steps.ver.outputs.version }}-windows-x86_64-setup.exe` (installer), plus the `.msi` on stable releases — an MSI version is three numeric fields, so it cannot carry a `-dev.N` prerelease. SmartScreen shows *"Windows protected your PC"* → *More info* → *Run anyway*.
          - **Linux:** `cosmos-pay-v${{ steps.ver.outputs.version }}-linux-x86_64.AppImage` (`chmod +x`, then run — no install; built on Ubuntu 24.04, so it needs glibc 2.39+), or the `.deb` / `.rpm` for a system package.
          - **macOS:** `cosmos-pay-v${{ steps.ver.outputs.version }}-macos-arm64.dmg`. Gatekeeper blocks it on first open → right-click the app → *Open*.

          **Phone apps** (same schedule as the desktop builds above):
          - **Android:** `cosmos-pay-v${{ steps.ver.outputs.version }}-debug.apk` installs on any device with *Install unknown apps* enabled. `cosmos-pay-v${{ steps.ver.outputs.version }}.apk` (release-signed) and the matching `.aab` for Play Console appear only when the repository has the release keystore configured.
          - **iOS:** no download yet. A Tauri iOS app can only be built through `tauri ios build`, whose export step needs an Apple signing identity this repository has no secrets for, so CI compiles both halves of the app to catch breakage but cannot package one. Build it yourself from the tag with `npm run ios:build` on a Mac with an Apple ID configured in Xcode.
          MD
          echo "=== RELEASE_NOTES.md ===" && cat RELEASE_NOTES.md

      # Stable releases only: regenerate the committed CHANGELOG.md (full history).
      # Dev prereleases are ephemeral, so they never touch the file.
      - name: Update CHANGELOG.md (main)
        if: github.ref_name == 'main'
        run: npx --yes git-cliff@2 --tag "v${{ steps.ver.outputs.version }}" --output CHANGELOG.md

      # ---- 3. Build web + both extensions (manifest version comes from package.json) ----
      - name: Build web (dist/web/)
        run: npm run build

      - name: Build Chrome extension (dist/extension/)
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/build-extension.ts

      - name: Build Firefox extension (dist/extension-firefox/)
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/build-extension.ts firefox

      # ---- 4. Zip each extension (manifest.json at the archive root) ----
      - name: Package .zip artifacts
        id: zip
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist/release
          ( cd dist/extension && zip -qr "../release/cosmos-pay-chrome-v${V}.zip" . )
          ( cd dist/extension-firefox && zip -qr "../release/cosmos-pay-firefox-v${V}.zip" . )
          echo "Packaged:"; ls -lh dist/release

      # ---- 5a. On main only: commit the bump back + tag ----
      - name: Commit version bump (main)
        if: github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.ver.outputs.version }} [skip ci]"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      # ---- 5b. On dev: tag the current commit (no bump commit, ephemeral prerelease) ----
      - name: Tag prerelease (dev)
        if: github.ref_name == 'dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      # ---- 5c. Publish the release with the .zip files attached ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cosmos Pay v${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/release/cosmos-pay-chrome-v${{ steps.ver.outputs.version }}.zip
            dist/release/cosmos-pay-firefox-v${{ steps.ver.outputs.version }}.zip

  # ---- 6. Build the phone binaries against the tag and append them to that release ----
  #
  # `ref` is the tag rather than the branch, so a push landing while this runs cannot swap the
  # tree underneath the APK. On `main` that tag already carries the bumped package.json; on
  # `dev` it does not — the bump lives only in the release job's workspace — which is why
  # `version` is passed explicitly and re-stamped inside the native workflow.
  native:
    name: Native binaries
    needs: release
    permissions:
      contents: write # `gh release upload` onto the release the job above published
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.release.outputs.version }}
      release-tag: v${{ needs.release.outputs.version }}
      ref: v${{ needs.release.outputs.version }}
    secrets: inherit
