name: Deploy web (cosmospay.lat/wallet)

# Continuous deployment of the web build to the Cosmos Pay server, served by nginx
# at https://cosmospay.lat/wallet/.
#
# The build is the GitHub Pages one under a different base (PAGES_BASE=/wallet/).
# It reaches the server over SSH as a user whose key is pinned to ONE forced command
# (deploy/receive-wallet-web.sh, installed as /usr/local/bin/receive-wallet-web.sh):
# that command reads a tarball on stdin, publishes it as a new release, smoke-tests
# it through nginx and rolls back on failure. The key can do nothing else — no
# shell, no forwarding, no other path on disk.
#
# Settings (Settings -> Secrets and variables -> Actions):
#   secrets.WALLET_DEPLOY_SSH_KEY      private key of the deploy user (ed25519)
#   vars.WALLET_DEPLOY_HOST            e.g. 147.135.215.201
#   vars.WALLET_DEPLOY_USER            e.g. walletdeploy
#   vars.WALLET_DEPLOY_KNOWN_HOSTS     `ssh-keyscan -t ed25519 <host>` output
#   vars.PUBLIC_COSMOS_*               the same build-time variables as Pages
# With no WALLET_DEPLOY_HOST the job is skipped, so forks and a repo without a
# server keep a green run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server-web
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.WALLET_DEPLOY_HOST != '' }}
    environment:
      name: cosmospay-server
      url: https://cosmospay.lat/wallet/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          PAGES_BASE: /wallet/
          COSMOS_ICONS: release
          PUBLIC_COSMOS_GATEWAY_URL: ${{ vars.PUBLIC_COSMOS_GATEWAY_URL }}
          PUBLIC_COSMOS_GATEWAY_ENTRY: ${{ vars.PUBLIC_COSMOS_GATEWAY_ENTRY }}
          PUBLIC_COSMOS_PUBLIC_KEY_DEV: ${{ vars.PUBLIC_COSMOS_PUBLIC_KEY_DEV }}
          PUBLIC_COSMOS_PUBLIC_KEY_PROD: ${{ vars.PUBLIC_COSMOS_PUBLIC_KEY_PROD }}
          PUBLIC_COSMOS_RECOVERY_A_URL: ${{ vars.PUBLIC_COSMOS_RECOVERY_A_URL }}
          PUBLIC_COSMOS_RECOVERY_B_URL: ${{ vars.PUBLIC_COSMOS_RECOVERY_B_URL }}

      # A web build without a gateway calls the API on its own origin, which only
      # works behind the dev server's proxy: cosmospay.lat/cosmos-api is a 404.
      - name: Check the build
        run: |
          grep -q '/wallet/assets/' dist/web/index.html || { echo "::error::build is not under /wallet/"; exit 1; }
          if [ -z "${{ vars.PUBLIC_COSMOS_GATEWAY_URL }}" ]; then
            echo "::error::vars.PUBLIC_COSMOS_GATEWAY_URL is empty: the web app would call its own origin"; exit 1
          fi

      - name: Publish
        env:
          SSH_KEY: ${{ secrets.WALLET_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.WALLET_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.WALLET_DEPLOY_HOST }}
          USER: ${{ vars.WALLET_DEPLOY_USER || 'walletdeploy' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The forced command takes the release name from the command line and
          # ignores everything else, so this is the only thing the key can ask for.
          tar -czf - -C dist/web . | ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes \
            -o BatchMode=yes "$USER@$HOST" "${GITHUB_SHA::12}"
