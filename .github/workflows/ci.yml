name: CI

# Build + typecheck + browser tests on every push and PR. Produces the two
# deploy-ready web artifacts (dist/web/ for web+native, dist/extension/ for MV3 browsers)
# and, through the reusable native workflow, the phone binaries that wrap dist/web/.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # astro check = TypeScript + Astro diagnostics (must be 0 errors)
      - name: Typecheck
        run: npm run check

      # node:test over the pure modules — key derivation, vault crypto, amount/memo
      # parsing, asset identity, the pre-signature guard. No browser needed, so this
      # runs before the build and fails fast on a money-path regression.
      - name: Unit tests
        run: npm run test:unit

      # Static site -> dist/web/ (this is what Capacitor wraps for native, too)
      - name: Build web (dist/web/)
        run: npm run build

      # Post-process dist/web/ into an MV3 unpacked extension -> dist/extension/
      - name: Build extension (dist/extension/)
        run: npm run build:ext

      - name: Upload web build (dist/web/)
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/web
          if-no-files-found: error

      - name: Upload browser extension (dist/extension/)
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: dist/extension
          if-no-files-found: error

  test:
    name: Browser tests (e2e + responsive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Serve dist in background
        run: |
          npm run serve:dist &
          # wait until the static server answers (max ~30s)
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4321 >/dev/null; do sleep 1; done'

      # Security-critical path: SEP-5 derivation, AES-GCM vault, unlock/decrypt.
      - name: E2E wallet smoke test
        run: npm run test:e2e
        env:
          E2E_URL: http://127.0.0.1:4321

      # Device adaptation: no overflow + fluid scaling across phone/tablet/desktop.
      - name: Responsive layout test
        run: npm run test:responsive
        env:
          E2E_URL: http://127.0.0.1:4321

  # Phone binaries on every push and PR: a debug APK, and on non-PR runs an unsigned iOS
  # build too. Definition in .github/workflows/native.yml, shared with the release pipeline.
  #
  # Not `needs: build` on purpose. The Android job compiles the whole native project — that
  # is a different failure surface from `astro check`, and gating it behind the web build
  # would only delay the one signal nobody else produces. Both jobs run npm ci and the web
  # build anyway; they are parallel, not sequential.
  #
  # iOS is skipped on pull requests, and that is a cost decision rather than a taste one: a
  # macOS runner bills at ten times a Linux one and the free-tier pool allows few of them at
  # once, so it runs on pushes to main/dev — where a broken Package.swift still gets caught before
  # a release — instead of on every push to every open branch. Drop the `ios:` line to build
  # it on PRs as well.
  native:
    name: Native binaries
    permissions:
      contents: read # artifacts only; nothing here uploads to a release
    uses: ./.github/workflows/native.yml
    with:
      ios: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
