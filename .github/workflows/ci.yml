name: CI

# Build + typecheck + browser tests on every push and PR. Produces the two deploy-ready
# web artifacts (dist/web/ for web+native, dist/extension/ for MV3 browsers) and, through
# the reusable native workflow, the desktop and phone binaries that embed dist/web/.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # astro check = TypeScript + Astro diagnostics (must be 0 errors)
      - name: Typecheck
        run: npm run check

      # node:test over the pure modules — key derivation, vault crypto, amount/memo
      # parsing, asset identity, the pre-signature guard. No browser needed, so this
      # runs before the build and fails fast on a money-path regression.
      - name: Unit tests
        run: npm run test:unit

      # Static site -> dist/web/ (this is what Tauri embeds for desktop and mobile, too)
      - name: Build web (dist/web/)
        run: npm run build

      # Post-process dist/web/ into an MV3 unpacked extension -> dist/extension/
      - name: Build extension (dist/extension/)
        run: npm run build:ext

      # The Rust half, on the one runner that is already warm.
      #
      # `native.yml` builds the real bundles, but its desktop matrix is gated to non-PR runs
      # (three runners, one of them macOS) — so without this a PR could break
      # src-tauri/ and nothing would say so until it merged. `cargo check` is minutes rather
      # than tens of them, and it covers the desktop half of the wallet's own plugin.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Shorter than the list native.yml installs: `cargo check` needs the headers the
      # tauri crates link against, not the tooling that bundles an AppImage.
      - name: Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev

      - name: Typecheck Rust (src-tauri)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Upload web build (dist/web/)
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/web
          if-no-files-found: error

      - name: Upload browser extension (dist/extension/)
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: dist/extension
          if-no-files-found: error

  test:
    name: Browser tests (e2e + responsive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Serve dist in background
        run: |
          npm run serve:dist &
          # wait until the static server answers (max ~30s)
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4321 >/dev/null; do sleep 1; done'

      # Security-critical path: SEP-5 derivation, AES-GCM vault, unlock/decrypt.
      - name: E2E wallet smoke test
        run: npm run test:e2e
        env:
          E2E_URL: http://127.0.0.1:4321

      # Device adaptation: no overflow + fluid scaling across phone/tablet/desktop.
      - name: Responsive layout test
        run: npm run test:responsive
        env:
          E2E_URL: http://127.0.0.1:4321

  # Installable binaries. A debug APK on every push and PR; the desktop bundles and an
  # unsigned iOS build on non-PR runs. Definition in .github/workflows/native.yml, shared
  # with the release pipeline.
  #
  # Not `needs: build` on purpose. The Android job compiles the whole native project — that
  # is a different failure surface from `astro check`, and gating it behind the web build
  # would only delay the one signal nobody else produces. Both jobs run npm ci and the web
  # build anyway; they are parallel, not sequential.
  #
  # EVERY PLATFORM BUILDS ON EVERY RUN, pull requests included. This used to skip desktop and
  # iOS on PRs to save runner minutes — the desktop matrix is three runners, iOS is a fourth,
  # and a macOS runner bills at ten times a Linux one.
  #
  # The saving was not free, and the bill came due: iOS had NEVER completed a build here, so
  # `-configuration Release` matching none of cargo-mobile2's lower-case configuration names
  # sat undiscovered until it broke a push to `dev`, and `native:perms` was called by a name
  # package.json did not define. Both were merged by green PRs. A check that only runs after
  # merge does not gate anything; it just moves the failure onto whoever pushes next.
  #
  # So the trade is deliberate and the other way round now: minutes on every PR, in exchange
  # for the branch protection actually meaning the binaries build. If the cost has to come
  # down again, narrow the MATRIX (one desktop OS on PRs, all three on push) rather than
  # switching a platform off entirely — partial coverage beats none.
  native:
    name: Native binaries
    permissions:
      contents: read # artifacts only; nothing here uploads to a release
    uses: ./.github/workflows/native.yml
    with:
      desktop: true
      ios: true
    secrets: inherit
