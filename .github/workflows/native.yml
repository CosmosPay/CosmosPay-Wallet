name: Native builds

# The one place that turns this repo into installable binaries.
#
# It is a REUSABLE workflow (`workflow_call`), not a standalone one, because the same jobs
# are wanted from two very different places and duplicating them is how one pipeline ends
# up being the only one that never runs a given check:
#
#   * .github/workflows/ci.yml — every push and PR, unsigned/debug, artifacts only.
#   * .github/workflows/release-extension.yml — once per published release, stamped with
#     the version that release bumped to, and attached to the GitHub Release itself.
#
# `workflow_dispatch` is kept so a binary can still be produced on demand from any branch.
#
# What comes out:
#   Desktop — Windows (NSIS + MSI), macOS (.dmg) and Linux (AppImage + .deb + .rpm), all
#             unsigned. Unsigned is honest rather than lazy: code-signing certificates are
#             per-organisation secrets, and a pipeline that pretended otherwise would fail
#             on every fork.
#   Android — a debug-signed APK, always. Plus a signed release APK *and* an AAB when the
#             keystore secrets below are configured. There is no unsigned release APK in
#             the outputs on purpose: nothing can install one, so shipping it would be a
#             download that only ever fails.
#   iOS     — an unsigned .ipa. Building is all a runner without an Apple Developer account
#             can do; a device install still needs re-signing. It earns its place anyway: it
#             is the only thing that catches a Package.swift, a purpose-string or a
#             deployment-target break before a release — exactly the class of breakage
#             nobody on a Windows machine can reproduce, and the half of
#             src-tauri/plugins/cosmos that no other job compiles at all.
#
# Signing (optional — set all four as repository secrets to get a Play-ready build):
#   ANDROID_KEYSTORE_BASE64    base64 of your release .keystore/.jks  (`base64 -w0 release.jks`)
#   ANDROID_KEYSTORE_PASSWORD  the store password
#   ANDROID_KEY_ALIAS          the key alias inside the store
#   ANDROID_KEY_PASSWORD       that key's password
# Absent any of them the job says so in its log and falls back to the debug APK rather than
# failing: a fork and a first-time clone must still get a testable build out of CI.
#
# Signing happens with apksigner/jarsigner AFTER Gradle, never through a signingConfig in
# the generated project. `src-tauri/gen/` is a build output — see CLAUDE.md — so a keystore
# path written into it would be secret handling that `tauri android init` erases.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to stamp into the binaries. Empty = whatever package.json says.'
        type: string
        required: false
        default: ''
      release-tag:
        description: 'Existing GitHub Release tag to attach the binaries to. Empty = artifacts only.'
        type: string
        required: false
        default: ''
      ref:
        description: 'Git ref to build. Empty = the ref that triggered the caller.'
        type: string
        required: false
        default: ''
      desktop:
        description: 'Build the desktop bundles (three runners, one per OS).'
        type: boolean
        required: false
        default: true
      ios:
        description: 'Also build iOS (macOS runner, several times the wall clock of the Android job).'
        type: boolean
        required: false
        default: true
  workflow_dispatch:

# The version is a single source of truth: src-tauri/tauri.conf.json reads it from
# package.json, so stamping a release is `npm version` and nothing else. There is no
# separate native version script any more — there is nothing left for it to keep in sync.
env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- desktop

  desktop:
    name: Desktop (${{ matrix.os }})
    if: inputs.desktop
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing must not cancel the other two: a WebKitGTK package rename on the
      # Linux runner says nothing about whether the Windows bundle is fine.
      fail-fast: false
      matrix:
        include:
          # 24.04, not 22.04: the Ubuntu 22 images begin deprecation on 2026-09-17 with
          # brownouts that FAIL jobs outright, and go fully unsupported on 2027-04-17. A
          # Linux release that stops appearing during a brownout window is exactly the
          # failure this pin exists to avoid.
          #
          # The cost is the AppImage's glibc floor — built here it needs 2.39, so Ubuntu
          # 22.04 and Debian 12 cannot run it. That is the trade the deprecation forces:
          # the .deb and .rpm are unaffected, and a genuinely portable AppImage needs a
          # container build rather than an older runner.
          - os: ubuntu-24.04
            bundles: bundle/appimage bundle/deb bundle/rpm
          - os: macos-latest
            bundles: bundle/dmg
          - os: windows-latest
            bundles: bundle/nsis bundle/msi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # WebKitGTK and libsoup3 are what Tauri renders into on Linux; they are not on the
      # runner image. The other two OSes ship their WebView with the system.
      #
      # Tauri's documented Ubuntu 24.04 list, plus patchelf for the AppImage. Note
      # `libayatana-appindicator3-dev` and NOT `libappindicator3-dev`: the latter does not
      # exist on 24.04, and apt fails the whole step on one unknown package name.
      - name: Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential curl wget file patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Stamp release version
        if: inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"

      # `tauri build` runs `npm run build` itself (beforeBuildCommand), so the web bundle
      # is never stale relative to what gets embedded.
      #
      # THE MSI IS DROPPED ON A PRERELEASE, and only there. An MSI's ProductVersion is three
      # numeric fields, so WiX cannot encode `1.3.1-dev.55` and refuses the whole bundle:
      #
      #     failed to bundle project: `optional pre-release identifier in app version must
      #     be numeric-only and cannot be greater than 65535 for msi target`
      #
      # Every dev push carries exactly that shape — release-extension.yml stamps
      # `X.Y.Z-dev.<run_number>` — so the Windows leg failed on all of them while `main`,
      # which has no prerelease, was fine. NSIS has no such rule and still ships, so a dev
      # build keeps its installer; a stable release still gets both.
      #
      # Renaming the version to something numeric would ALSO satisfy WiX and is not the fix:
      # cliff.toml keeps dev tags out of the changelog with `ignore_tags = '.*-dev.*'`, so a
      # scheme without that substring would quietly write every dev push into CHANGELOG.md.
      - name: Build desktop bundles
        shell: bash
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            VERSION=$(node -p "require('./package.json').version")
            PRE="${VERSION#*-}"
            if [ "$PRE" != "$VERSION" ] && ! printf '%s' "$PRE" | grep -qE '^[0-9]+$'; then
              echo "version $VERSION carries a non-numeric prerelease ('$PRE') — MSI cannot"
              echo "encode it; building the NSIS installer only."
              ARGS="--bundles nsis"
            fi
          fi
          npm run desktop:build -- $ARGS

      # Tauri names every bundle after `productName`, so they come out as
      # "Cosmos Pay_1.3.0_x64-setup.exe" — spaces included, which GitHub then silently
      # rewrites to dots when it attaches them. Renamed here to the same
      # `cosmos-pay-v<version>-…` scheme as the APK and the .ipa, so the release notes can
      # name a file and be right about it.
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ARCH=$(uname -m)
          case "${{ runner.os }}" in
            Windows) OS_TAG=windows ;;
            macOS)   OS_TAG=macos ;;
            *)       OS_TAG=linux ;;
          esac
          NAME="cosmos-pay-v$VERSION-$OS_TAG-$ARCH"

          mkdir -p out
          for dir in ${{ matrix.bundles }}; do
            src="src-tauri/target/release/$dir"
            [ -d "$src" ] || { echo "no $src — skipping"; continue; }
            find "$src" -maxdepth 1 -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
              -print0 | while IFS= read -r -d '' file; do
                base=$(basename "$file")
                case "$base" in
                  # NSIS and MSI are both Windows installers and both end up as .exe/.msi;
                  # the setup suffix is what tells them apart in a release listing.
                  *-setup.exe) cp "$file" "out/$NAME-setup.exe" ;;
                  *)           cp "$file" "out/$NAME.${base##*.}" ;;
                esac
              done
          done
          echo "collected:"; ls -la out
          # An empty `out` means the bundler produced nothing this matrix leg expected, and
          # `if-no-files-found: error` below would catch it — but only after the upload step
          # has already been reached, which reads as an upload problem rather than a build
          # one. Fail here, where the cause is.
          [ -n "$(ls -A out)" ] || { echo "no bundles were produced for ${{ runner.os }}"; exit 1; }

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: out
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ inputs.release-tag }}" out/* --clobber

  # ---------------------------------------------------------------- android

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Tauri cross-compiles the Rust core for four ABIs; without the targets the build
      # fails deep inside cargo with a message about a missing std, which reads like a
      # toolchain corruption rather than a missing `rustup target add`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Stamp release version
        if: inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"

      # The four-language contract test lives here. Rust cannot see the Kotlin, TypeScript
      # cannot see either, and this is the only job that would notice the drift at all.
      - name: Unit tests
        run: npm run test:unit

      # Generates src-tauri/gen/android from the Tauri templates and then restores the
      # committed launcher art over it (npm run android:res, wired into android:init).
      - name: Generate the Android project
        run: npm run android:init

      # Declarations the generated manifest does not carry: CAMERA, USE_BIOMETRIC, the
      # uses-feature rows that keep the Play listing visible, and allowBackup="false".
      - name: Restore native permissions
        run: npm run native:perms

      - name: Resolve build name
        run: echo "BUILD_NAME=cosmos-pay-$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "signing secrets absent — this run produces the debug APK only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: npm run android:build -- --debug --apk

      - name: Build release APK + AAB
        if: steps.keystore.outputs.signed == 'true'
        run: npm run android:build -- --apk --aab

      - name: Sign release APK + AAB
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUTPUTS=src-tauri/gen/android/app/build/outputs

          # apksigner for the APK (v2/v3 scheme), jarsigner for the bundle — an AAB is a
          # jar and apksigner refuses it outright.
          find "$OUTPUTS/apk/universal/release" -name '*.apk' | while read -r apk; do
            "$BUILD_TOOLS/zipalign" -p -f 4 "$apk" "$apk.aligned"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$apk" "$apk.aligned"
            rm -f "$apk.aligned"
          done

          find "$OUTPUTS/bundle" -name '*.aab' | while read -r aab; do
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              "$aab" "$KEY_ALIAS"
          done

      - name: Collect binaries
        run: |
          set -euo pipefail
          mkdir -p out
          OUTPUTS=src-tauri/gen/android/app/build/outputs
          # The debug APK is the one output that always exists, so it is never conditional.
          find "$OUTPUTS/apk" -name '*debug*.apk' -exec cp {} "out/$BUILD_NAME-debug.apk" \;
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            find "$OUTPUTS/apk" -path '*release*' -name '*.apk' -exec cp {} "out/$BUILD_NAME.apk" \;
            find "$OUTPUTS/bundle" -name '*.aab' -exec cp {} "out/$BUILD_NAME.aab" \;
          fi
          ls -la out

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: out
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release-tag }}" out/* --clobber

  # ------------------------------------------------------------------- ios

  ios:
    name: iOS
    if: inputs.ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Stamp release version
        if: inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"

      - name: Build the web bundle
        run: npm run build

      - name: Generate the Xcode project
        run: npm run ios:init

      # Purpose strings. On iOS a missing one is not a denied prompt — the OS terminates
      # the app the moment the API is touched, so the first Face ID unlock would be a crash.
      - name: Restore native permissions
        run: npm run native:perms

      - name: Resolve build name
        run: echo "BUILD_NAME=cosmos-pay-$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # `tauri ios build` drives xcodebuild with an export step that needs a signing team,
      # which a runner without an Apple Developer account does not have. xcodebuild directly,
      # with signing switched off, is what a CI can actually produce — and it still compiles
      # every Swift file in src-tauri/plugins/cosmos, which is the point of this job.
      #
      # The scheme name follows `productName` in tauri.conf.json and contains a space, so it
      # is discovered rather than hardcoded: a rename would otherwise fail here with
      # "scheme not found" long after the change that caused it.
      #
      # THE CONFIGURATION IS DISCOVERED FOR A SHARPER REASON. cargo-mobile2 names the two
      # build configurations `debug` and `release`, in LOWER CASE, so the `-configuration
      # Release` this step used to pass matched nothing — and xcodebuild did not say so. It
      # fell back to the project default, which is `debug`, and the Rust script phase then
      # asked the Tauri CLI for a DEV build: it went looking for the `tauri ios dev` server
      # address file, found none on a CI runner, and aborted with a panic naming neither the
      # configuration nor the fallback:
      #
      #     panicked at crates/tauri-cli/src/mobile/mod.rs:386:59:
      #     failed to read missing addr file …/lat.cosmospay.wallet-server-addr
      #
      # Matching case-insensitively, and REFUSING when the project has no release
      # configuration at all, is what keeps that from silently shipping a debug .ipa.
      - name: Build unsigned .app
        run: |
          set -euo pipefail
          PROJECT=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
          LIST=$(xcodebuild -list -project "$PROJECT" -json)
          SCHEME=$(printf '%s' "$LIST" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const schemes = JSON.parse(s).project.schemes;
                const ios = schemes.find(x => x.endsWith('_iOS')) || schemes[0];
                process.stdout.write(ios);
              })")
          CONFIG=$(printf '%s' "$LIST" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const cfgs = JSON.parse(s).project.configurations || [];
                const rel = cfgs.find(c => c.toLowerCase() === 'release');
                if (!rel) {
                  process.stderr.write('no release configuration; project has: ' + cfgs.join(', ') + '\n');
                  process.exit(1);
                }
                process.stdout.write(rel);
              })")
          echo "building scheme: $SCHEME (configuration: $CONFIG)"
          # THE ENV DUMP IS FILTERED so the error survives. When a script phase fails,
          # xcodebuild prints every build setting as an indented `export FOO=bar` line — 352
          # of the last failure's 530 log lines — and that pushed the Rust error which
          # actually failed the build past the size GitHub keeps for one step. The log ended
          # mid-dump, alphabetically at O, and the job read as "exit code 65" and nothing
          # else. Only those lines are dropped; `pipefail` above keeps xcodebuild's status,
          # and sed exits 0 either way so an all-filtered run cannot fail the step by itself.
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | sed -E '/^[[:space:]]+export [A-Za-z_0-9]/d'

      # An .ipa is a zip with the .app inside a Payload/ directory and nothing else. Made by
      # hand because `-exportArchive` needs the signing identity this job does not have.
      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "no .app was produced"; exit 1; }
          mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qr "out/$BUILD_NAME-unsigned.ipa" Payload
          ls -la out

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: out
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release-tag }}" out/* --clobber
