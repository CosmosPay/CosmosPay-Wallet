name: Native builds

# The one place that turns this repo into installable binaries.
#
# It is a REUSABLE workflow (`workflow_call`), not a standalone one, because the same jobs
# are wanted from two very different places and duplicating them is how one pipeline ends
# up being the only one that never runs a given check:
#
#   * .github/workflows/ci.yml — every push and PR, unsigned/debug, artifacts only.
#   * .github/workflows/release-extension.yml — once per published release, stamped with
#     the version that release bumped to, and attached to the GitHub Release itself.
#
# `workflow_dispatch` is kept so a binary can still be produced on demand from any branch.
#
# What comes out:
#   Desktop — Windows (NSIS + MSI), macOS (.dmg) and Linux (AppImage + .deb + .rpm), all
#             unsigned. Unsigned is honest rather than lazy: code-signing certificates are
#             per-organisation secrets, and a pipeline that pretended otherwise would fail
#             on every fork.
#   Android — a debug-signed APK, always. Plus a signed release APK *and* an AAB when the
#             keystore secrets below are configured. There is no unsigned release APK in
#             the outputs on purpose: nothing can install one, so shipping it would be a
#             download that only ever fails.
#   iOS     — a signed .ipa when the Apple secrets below are configured; otherwise NO
#             INSTALLABLE ARTEFACT, and the job says so rather than pretending. There is no
#             unsigned fallback for the same reason there is no unsigned release APK:
#             nothing can install one. An iOS build cannot be made unsigned at all — a Tauri
#             Xcode project can only be built by `tauri ios build`, whose export step needs
#             a signing identity; see the long comment on the job itself for why
#             `xcodebuild` directly cannot work here and why the .ipa on v1.4.0/v1.4.1 was a
#             Capacitor build. Unsigned, the job still compiles both halves — the Rust
#             `aarch64-apple-ios` target and the Swift package — which is what catches a
#             Package.swift, a purpose-string or a deployment-target break: exactly the
#             class of breakage nobody on a Windows machine can reproduce, and the half of
#             src-tauri/plugins/cosmos that no other job compiles at all. Those two compile
#             steps run either way, because they fail faster and more legibly than an
#             archive does.
#
# Signing — Android (optional; set all four as repository secrets for a Play-ready build):
#   ANDROID_KEYSTORE_BASE64    base64 of your release .keystore/.jks  (`base64 -w0 release.jks`)
#   ANDROID_KEYSTORE_PASSWORD  the store password
#   ANDROID_KEY_ALIAS          the key alias inside the store
#   ANDROID_KEY_PASSWORD       that key's password
#
# Signing — iOS (optional; set all four for an .ipa):
#   IOS_CERTIFICATE_BASE64           base64 of the Apple Distribution .p12 (cert + private key)
#   IOS_CERTIFICATE_PASSWORD         the password that .p12 was exported with
#   IOS_PROVISIONING_PROFILE_BASE64  base64 of the matching .mobileprovision
#   IOS_TEAM_ID                      the 10-character Apple Team ID
# Optional repository VARIABLE (not a secret — it is not one):
#   IOS_EXPORT_METHOD          release-testing (default) | app-store-connect | enterprise |
#                              debugging. `release-testing` is ad-hoc: installable on the
#                              devices listed in the profile, which is what a download from
#                              a GitHub Release has to be. `app-store-connect` produces an
#                              .ipa that ONLY App Store Connect accepts — attaching one to a
#                              release would be a file nobody can open.
#
# Absent any of a platform's secrets that platform says so in its log and degrades rather
# than failing — the debug APK on Android, a compile check on iOS. A fork and a first-time
# clone have neither set and must still get a green build with something testable in it.
#
# Both platforms sign OUTSIDE the generated project: apksigner/jarsigner after Gradle, and a
# throwaway keychain the iOS job creates and destroys. `src-tauri/gen/` is a build output —
# see CLAUDE.md — so a keystore path or a DEVELOPMENT_TEAM written into it would be secret
# handling that the next `tauri android|ios init` erases without a word.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to stamp into the binaries. Empty = whatever package.json says.'
        type: string
        required: false
        default: ''
      release-tag:
        description: 'Existing GitHub Release tag to attach the binaries to. Empty = artifacts only.'
        type: string
        required: false
        default: ''
      ref:
        description: 'Git ref to build. Empty = the ref that triggered the caller.'
        type: string
        required: false
        default: ''
      desktop:
        description: 'Build the desktop bundles (three runners, one per OS).'
        type: boolean
        required: false
        default: true
      ios:
        description: 'Also build iOS (macOS runner, several times the wall clock of the Android job).'
        type: boolean
        required: false
        default: true
  workflow_dispatch:

# The version is a single source of truth: src-tauri/tauri.conf.json reads it from
# package.json, so stamping a release is `npm version` and nothing else. There is no
# separate native version script any more — there is nothing left for it to keep in sync.
env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- desktop

  desktop:
    name: Desktop (${{ matrix.os }})
    if: inputs.desktop
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing must not cancel the other two: a WebKitGTK package rename on the
      # Linux runner says nothing about whether the Windows bundle is fine.
      fail-fast: false
      matrix:
        include:
          # 24.04, not 22.04: the Ubuntu 22 images begin deprecation on 2026-09-17 with
          # brownouts that FAIL jobs outright, and go fully unsupported on 2027-04-17. A
          # Linux release that stops appearing during a brownout window is exactly the
          # failure this pin exists to avoid.
          #
          # The cost is the AppImage's glibc floor — built here it needs 2.39, so Ubuntu
          # 22.04 and Debian 12 cannot run it. That is the trade the deprecation forces:
          # the .deb and .rpm are unaffected, and a genuinely portable AppImage needs a
          # container build rather than an older runner.
          - os: ubuntu-24.04
            bundles: bundle/appimage bundle/deb bundle/rpm
          - os: macos-latest
            bundles: bundle/dmg
          - os: windows-latest
            bundles: bundle/nsis bundle/msi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # WebKitGTK and libsoup3 are what Tauri renders into on Linux; they are not on the
      # runner image. The other two OSes ship their WebView with the system.
      #
      # Tauri's documented Ubuntu 24.04 list, plus patchelf for the AppImage. Note
      # `libayatana-appindicator3-dev` and NOT `libappindicator3-dev`: the latter does not
      # exist on 24.04, and apt fails the whole step on one unknown package name.
      - name: Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential curl wget file patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Stamp release version
        if: inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"

      # `tauri build` runs `npm run build` itself (beforeBuildCommand), so the web bundle
      # is never stale relative to what gets embedded.
      #
      # THE MSI IS DROPPED ON A PRERELEASE, and only there. An MSI's ProductVersion is three
      # numeric fields, so WiX cannot encode `1.3.1-dev.55` and refuses the whole bundle:
      #
      #     failed to bundle project: `optional pre-release identifier in app version must
      #     be numeric-only and cannot be greater than 65535 for msi target`
      #
      # Every dev push carries exactly that shape — release-extension.yml stamps
      # `X.Y.Z-dev.<run_number>` — so the Windows leg failed on all of them while `main`,
      # which has no prerelease, was fine. NSIS has no such rule and still ships, so a dev
      # build keeps its installer; a stable release still gets both.
      #
      # Renaming the version to something numeric would ALSO satisfy WiX and is not the fix:
      # cliff.toml keeps dev tags out of the changelog with `ignore_tags = '.*-dev.*'`, so a
      # scheme without that substring would quietly write every dev push into CHANGELOG.md.
      - name: Build desktop bundles
        shell: bash
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            VERSION=$(node -p "require('./package.json').version")
            PRE="${VERSION#*-}"
            if [ "$PRE" != "$VERSION" ] && ! printf '%s' "$PRE" | grep -qE '^[0-9]+$'; then
              echo "version $VERSION carries a non-numeric prerelease ('$PRE') — MSI cannot"
              echo "encode it; building the NSIS installer only."
              ARGS="--bundles nsis"
            fi
          fi
          npm run desktop:build -- $ARGS

      # Tauri names every bundle after `productName`, so they come out as
      # "Cosmos Pay_1.3.0_x64-setup.exe" — spaces included, which GitHub then silently
      # rewrites to dots when it attaches them. Renamed here to the same
      # `cosmos-pay-v<version>-…` scheme as the APK, so the release notes can
      # name a file and be right about it.
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ARCH=$(uname -m)
          case "${{ runner.os }}" in
            Windows) OS_TAG=windows ;;
            macOS)   OS_TAG=macos ;;
            *)       OS_TAG=linux ;;
          esac
          NAME="cosmos-pay-v$VERSION-$OS_TAG-$ARCH"

          mkdir -p out
          for dir in ${{ matrix.bundles }}; do
            src="src-tauri/target/release/$dir"
            [ -d "$src" ] || { echo "no $src — skipping"; continue; }
            find "$src" -maxdepth 1 -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
              -print0 | while IFS= read -r -d '' file; do
                base=$(basename "$file")
                case "$base" in
                  # NSIS and MSI are both Windows installers and both end up as .exe/.msi;
                  # the setup suffix is what tells them apart in a release listing.
                  *-setup.exe) cp "$file" "out/$NAME-setup.exe" ;;
                  *)           cp "$file" "out/$NAME.${base##*.}" ;;
                esac
              done
          done
          echo "collected:"; ls -la out
          # An empty `out` means the bundler produced nothing this matrix leg expected, and
          # `if-no-files-found: error` below would catch it — but only after the upload step
          # has already been reached, which reads as an upload problem rather than a build
          # one. Fail here, where the cause is.
          [ -n "$(ls -A out)" ] || { echo "no bundles were produced for ${{ runner.os }}"; exit 1; }

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: out
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ inputs.release-tag }}" out/* --clobber

  # ---------------------------------------------------------------- android

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Tauri cross-compiles the Rust core for four ABIs; without the targets the build
      # fails deep inside cargo with a message about a missing std, which reads like a
      # toolchain corruption rather than a missing `rustup target add`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Stamp release version
        if: inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"

      # The four-language contract test lives here. Rust cannot see the Kotlin, TypeScript
      # cannot see either, and this is the only job that would notice the drift at all.
      - name: Unit tests
        run: npm run test:unit

      # Generates src-tauri/gen/android from the Tauri templates and then restores the
      # committed launcher art over it (npm run android:res, wired into android:init).
      - name: Generate the Android project
        run: npm run android:init

      # Declarations the generated manifest does not carry: CAMERA, USE_BIOMETRIC, the
      # uses-feature rows that keep the Play listing visible, and allowBackup="false".
      - name: Restore native permissions
        run: npm run native:perms

      - name: Resolve build name
        run: echo "BUILD_NAME=cosmos-pay-$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "signing secrets absent — this run produces the debug APK only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: npm run android:build -- --debug --apk

      - name: Build release APK + AAB
        if: steps.keystore.outputs.signed == 'true'
        run: npm run android:build -- --apk --aab

      - name: Sign release APK + AAB
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUTPUTS=src-tauri/gen/android/app/build/outputs

          # apksigner for the APK (v2/v3 scheme), jarsigner for the bundle — an AAB is a
          # jar and apksigner refuses it outright.
          find "$OUTPUTS/apk/universal/release" -name '*.apk' | while read -r apk; do
            "$BUILD_TOOLS/zipalign" -p -f 4 "$apk" "$apk.aligned"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$apk" "$apk.aligned"
            rm -f "$apk.aligned"
          done

          find "$OUTPUTS/bundle" -name '*.aab' | while read -r aab; do
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              "$aab" "$KEY_ALIAS"
          done

      - name: Collect binaries
        run: |
          set -euo pipefail
          mkdir -p out
          OUTPUTS=src-tauri/gen/android/app/build/outputs
          # The debug APK is the one output that always exists, so it is never conditional.
          find "$OUTPUTS/apk" -name '*debug*.apk' -exec cp {} "out/$BUILD_NAME-debug.apk" \;
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            find "$OUTPUTS/apk" -path '*release*' -name '*.apk' -exec cp {} "out/$BUILD_NAME.apk" \;
            find "$OUTPUTS/bundle" -name '*.aab' -exec cp {} "out/$BUILD_NAME.aab" \;
          fi
          ls -la out

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: out
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release-tag }}" out/* --clobber

  # ------------------------------------------------------------------- ios

  ios:
    name: iOS
    if: inputs.ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Stamp release version
        if: inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"

      - name: Build the web bundle
        run: npm run build

      # BEFORE `ios:init`, and that ordering is the whole reason this step is here rather
      # than next to the build it serves. `tauri ios init` bakes DEVELOPMENT_TEAM into the
      # Xcode project it generates, reading it from `APPLE_DEVELOPMENT_TEAM`; a team
      # exported after the project exists is a team the project never saw, and the archive
      # then fails with "no signing certificate found" while the secret sits right there.
      #
      # `$GITHUB_ENV` and not a job-level `env:`, for the unsigned case: a job-level mapping
      # from an unset secret still SETS the variable, to the empty string, and an empty
      # DEVELOPMENT_TEAM is not the same thing as no DEVELOPMENT_TEAM. Written here, the
      # variable simply does not exist unless there is a real team to put in it.
      - name: Import the Apple signing identity
        id: apple
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ] \
             || [ -z "$PROVISIONING_PROFILE_BASE64" ] || [ -z "$TEAM_ID" ]; then
            echo "Apple signing secrets absent — this run stays a compile check and produces no .ipa."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A throwaway keychain, never the login one. The login keychain persists between
          # jobs on a self-hosted runner and is shared with anything else on the machine;
          # this one is created here, unlocked here and deleted by the cleanup step below,
          # so the private key exists for the length of one job and nowhere else.
          KEYCHAIN="$RUNNER_TEMP/cosmos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # -lut 21600, i.e. do not relock for six hours. The default is a 300-second idle
          # timeout, and a release archive takes longer than that: the lock lands mid-sign
          # and codesign reports "User interaction is not allowed", which reads like a
          # missing certificate rather than a clock.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          # Deleted immediately: the .p12 carries the private key, and $RUNNER_TEMP outlives
          # this step. The keychain is the only copy from here on.
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without a partition list, the first use of the key raises a GUI confirmation
          # dialog. On a headless runner that is not a refusal, it is a hang until the job
          # times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # ON the search list, not merely on disk: xcodebuild only looks at keychains the
          # user's list names, and `create-keychain` does not add them. The existing entries
          # are kept — replacing the list outright is how the system roots disappear and
          # every https call in the build starts failing certificate validation.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Both directories, because Xcode 16 moved it and the runner image decides which
          # Xcode is selected. Writing the one that is not read costs a file nobody opens.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$dir/cosmos-pay.mobileprovision"
          done

          echo "APPLE_DEVELOPMENT_TEAM=$TEAM_ID" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Generate the Xcode project
        run: npm run ios:init

      # Purpose strings. On iOS a missing one is not a denied prompt — the OS terminates
      # the app the moment the API is touched, so the first Face ID unlock would be a crash.
      - name: Restore native permissions
        run: npm run native:perms

      # THE TWO COMPILE STEPS BELOW RUN WHETHER OR NOT THERE IS AN .ipa AT THE END, and the
      # history behind them is worth keeping because the old shape looked like it worked:
      #
      # Until the migration to Tauri, this job ran `xcodebuild` straight at a CAPACITOR
      # project (`ios/App/App.xcodeproj`), which has no Rust in it, so building it unsigned
      # was fine — the .ipa attached to v1.4.0 and v1.4.1 is a Capacitor app. The step was
      # then carried over to the Tauri project unchanged, and a Tauri Xcode project cannot be
      # driven that way: its `Build Rust Code` phase shells out to `tauri ios xcode-script`,
      # which reads its options over a socket whose address `tauri ios build` writes to a temp
      # file first. With no parent process there is no file, and the CLI aborts:
      #
      #     panicked at crates/tauri-cli/src/mobile/mod.rs:386:59:
      #     failed to read missing addr file …/lat.cosmospay.wallet-server-addr
      #
      # That is unconditional — it happens in `release` as readily as in `debug`. So the only
      # supported way to build the app is `tauri ios build`, whose export step needs an Apple
      # signing identity and a provisioning profile. There is no unsigned .ipa to fall back
      # to: unlike Android, where an unsigned APK at least exists as a file, iOS has no
      # artefact at all without an identity.
      #
      # `Build the .ipa` below is that build, gated on the secrets. These two steps stay in
      # front of it either way, and not only for the unsigned case: they are the ones that
      # catch a Package.swift, a purpose-string or a deployment-target break that nobody on a
      # Windows machine can reproduce, and they fail in seconds with a compiler message
      # instead of somewhere inside a release archive.

      # `--lib` and not the whole crate: src-tauri also builds a desktop binary, and asking
      # for it here would try to link a macOS-shaped `main` against an iOS target. The lib
      # (`staticlib`, per Cargo.toml) IS the mobile entry point, so it is the half that
      # matters. Debug rather than release because this is a compile check and the release
      # profile sets `lto = true` with `codegen-units = 1` — minutes of link work that would
      # not surface an error the debug build misses.
      - name: Compile the Rust half for iOS
        run: cargo build --manifest-path src-tauri/Cargo.toml --lib --target aarch64-apple-ios

      # The Swift half — src-tauri/plugins/cosmos/ios — is the only place LAContext, the
      # Keychain flags and the share sheet are written, and no other job on any runner
      # compiles it. `xcodebuild` synthesises a scheme for a SwiftPM package, so the package
      # builds for a device without a project file and without signing (it is a static
      # library; there is nothing to sign).
      #
      # Package.swift depends on `../.tauri/tauri-api`, which `tauri ios init` above is what
      # provides — hence the ordering. The `find` is not decoration: that path is generated,
      # this repository only commits the Android copy, and if Tauri ever puts it elsewhere the
      # failure below would otherwise be an opaque "no such module Tauri".
      - name: Compile the Swift plugin for iOS
        run: |
          set -euo pipefail
          echo "vendored Tauri Swift API:"
          find src-tauri -maxdepth 6 -type d -name 'tauri-api' -print || true
          cd src-tauri/plugins/cosmos/ios
          xcodebuild build \
            -scheme tauri-plugin-cosmos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/swift-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | sed -E '/^[[:space:]]+export [A-Za-z_0-9]/d'

      # The build the rest of this job exists to make possible.
      #
      # `--help` is dumped first on purpose, and it is not decoration — it is the same
      # defence as the `find` above. `tauri ios` refuses to load off macOS, so this is the
      # one command surface in this file that nobody working on Windows or Linux can check
      # before pushing; if a CLI upgrade renames the flag, the log carries what the installed
      # version actually accepts instead of just "unexpected argument".
      #
      # `release-testing` by default — ad-hoc, installable on the devices the profile lists,
      # which is the only export a file attached to a GitHub Release can usefully be. Set the
      # IOS_EXPORT_METHOD repository VARIABLE to change it; it is not a secret, and storing a
      # non-secret as one is how a value nobody can read back gets forgotten.
      - name: Build the .ipa
        if: steps.apple.outputs.signed == 'true'
        env:
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          npx tauri ios build --help || true
          npm run ios:build -- --export-method "${IOS_EXPORT_METHOD:-release-testing}"

      - name: Collect the .ipa
        if: steps.apple.outputs.signed == 'true'
        run: |
          set -euo pipefail
          mkdir -p out
          BUILD_NAME="cosmos-pay-$(node -p "require('./package.json').version")"
          # `find`, not a literal path. src-tauri/gen/apple is generated, its export
          # directory has moved between Tauri releases, and a stale literal here would upload
          # nothing at all rather than fail — the one outcome worth engineering against,
          # because a release with a missing asset looks exactly like a release with one.
          find src-tauri/gen/apple -name '*.ipa' -exec cp {} "out/$BUILD_NAME.ipa" \;
          ls -la out
          # An empty `out` means the archive succeeded and the export landed somewhere this
          # does not look. Fail here, where the log still has the build in it.
          test -n "$(ls -A out)"

      - name: Upload the iOS artifact
        if: steps.apple.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: out
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: steps.apple.outputs.signed == 'true' && inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release-tag }}" out/* --clobber

      # `always()`, because the private key must not outlive the job on a runner that may be
      # reused. Hosted runners are destroyed after every job and this is redundant there; a
      # self-hosted one is not, and the difference is a signing identity left behind on a
      # machine that goes on to build something else.
      - name: Destroy the signing keychain
        if: always() && steps.apple.outputs.signed == 'true'
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/cosmos-pay.mobileprovision" \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/cosmos-pay.mobileprovision" || true
