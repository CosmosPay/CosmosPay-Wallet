<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cosmos Pay on Arc</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --black: #000000; --white: #FFFFFF; --navy: #05064F; --blue: #000877;
    --bg: var(--white); --ink: var(--black); --muted: #4A4A63; --card: #F2F2F5; --line: #D9D9E3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: var(--black); --ink: var(--white); --muted: #B9BBD9; --card: #0D0D1A; --line: #2A2A3F; }
  }
  :root[data-theme="dark"] { --bg: var(--black); --ink: var(--white); --muted: #B9BBD9; --card: #0D0D1A; --line: #2A2A3F; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font-size: 34px; line-height: 1.15; font-weight: 600; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin: 0 0 16px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 6px; }
  input { width: 100%; padding: 12px 14px; font: inherit; color: var(--ink); background: var(--bg);
          border: 1px solid var(--line); border-radius: 10px; }
  button { font: inherit; font-weight: 600; padding: 12px 18px; border: 0; border-radius: 10px;
           background: var(--blue); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .out { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all;
         white-space: pre-wrap; color: var(--muted); margin-top: 14px; }
  a { color: var(--blue); }
  @media (prefers-color-scheme: dark) { a { color: #9FA3FF; } }
  .pill { display: inline-block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
          color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="pill" id="net">Arc</p>
  <h1>Cosmos Pay on Arc</h1>
  <p class="lead">A merchant opens a payment intent, a customer settles it in USDC, and the receipt is an event anyone
    can read on Arc. It is the same object Cosmos Pay uses on Stellar, on a second rail.</p>

  <div class="card">
    <h2>1. Connect</h2>
    <div class="row">
      <button id="connect">Connect wallet</button>
      <button id="addChain" class="ghost">Add Arc to my wallet</button>
    </div>
    <div class="out" id="account"></div>
  </div>

  <div class="card">
    <h2>2. Charge</h2>
    <label for="amount">Amount in USDC</label>
    <input id="amount" inputmode="decimal" placeholder="5.00" value="1.00">
    <label for="memo">What it is for</label>
    <input id="memo" placeholder="Order #24" value="Order #24">
    <div class="row"><button id="create" disabled>Create payment link</button></div>
    <div class="out" id="created"></div>
  </div>

  <div class="card">
    <h2>3. Pay</h2>
    <label for="id">Intent id</label>
    <input id="id" placeholder="0x…">
    <div class="row">
      <button id="load" class="ghost">Load</button>
      <button id="approve" disabled>Approve USDC</button>
      <button id="pay" disabled>Pay</button>
    </div>
    <div class="out" id="status"></div>
  </div>

  <p class="lead" id="where"></p>
</div>

<script type="module">
import { BrowserProvider, Contract, JsonRpcProvider, hexlify, randomBytes, parseUnits, formatUnits }
  from "https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.min.js";

// Fill this in after running `npm run deploy`, or pass ?c=0x… to try another deployment.
const DEPLOYED = "";
const USDC = "0x3600000000000000000000000000000000000000";

const ARC = {
  chainIdHex: "0x13b2",            // 5042
  chainId: 5042,
  name: "Arc",
  rpc: "https://rpc.mainnet.arc.io",
  explorer: "https://explorer.arc.io",
};

const INTENTS_ABI = [
  "function create(bytes32 id, uint96 amount, string memo)",
  "function pay(bytes32 id)",
  "function get(bytes32 id) view returns (address merchant, uint96 amount, address payer, uint40 createdAt, uint40 paidAt, bool paid)",
  "function canPay(bytes32 id, address payer) view returns (bool enoughBalance, bool enoughAllowance)",
  "event IntentCreated(bytes32 indexed id, address indexed merchant, uint96 amount, string memo)",
  "event IntentPaid(bytes32 indexed id, address indexed payer, address indexed merchant, uint96 amount)",
];
const USDC_ABI = [
  "function approve(address spender, uint256 value) returns (bool)",
  "function balanceOf(address account) view returns (uint256)",
  "function decimals() view returns (uint8)",
];

const params = new URLSearchParams(location.search);
const address = params.get("c") || DEPLOYED;
const $ = (id) => document.getElementById(id);
const show = (el, text) => { $(el).textContent = text; };

$("net").textContent = `${ARC.name} · chain ${ARC.chainId} · gas in USDC`;
$("where").innerHTML = address
  ? `Contract: <a href="${ARC.explorer}/address/${address}" target="_blank" rel="noreferrer">${address}</a>`
  : "No contract address set yet. Deploy it, then put the address in <code>DEPLOYED</code> or pass <code>?c=0x…</code>.";

let signer, account;
const read = new JsonRpcProvider(ARC.rpc, ARC.chainId);

$("addChain").onclick = async () => {
  if (!window.ethereum) return show("account", "No EVM wallet found in this browser.");
  await window.ethereum.request({
    method: "wallet_addEthereumChain",
    params: [{
      chainId: ARC.chainIdHex,
      chainName: ARC.name,
      nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 },
      rpcUrls: [ARC.rpc],
      blockExplorerUrls: [ARC.explorer],
    }],
  });
};

$("connect").onclick = async () => {
  if (!window.ethereum) return show("account", "No EVM wallet found in this browser.");
  const provider = new BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  const net = await provider.getNetwork();
  if (Number(net.chainId) !== ARC.chainId) {
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: ARC.chainIdHex }] });
  }
  signer = await provider.getSigner();
  account = await signer.getAddress();
  const gas = await provider.getBalance(account);
  const usdc = await new Contract(USDC, USDC_ABI, read).balanceOf(account);
  show("account", `${account}\ngas balance ${formatUnits(gas, 18)} USDC · token balance ${formatUnits(usdc, 6)} USDC`);
  $("create").disabled = !address;
};

$("create").onclick = async () => {
  const id = hexlify(randomBytes(32));
  const amount = parseUnits($("amount").value || "0", 6);
  const contract = new Contract(address, INTENTS_ABI, signer);
  show("created", "Waiting for the wallet…");
  const tx = await contract.create(id, amount, $("memo").value || "");
  show("created", `Sent ${tx.hash}\nWaiting for confirmation…`);
  await tx.wait();
  const link = `${location.origin}${location.pathname}?c=${address}&id=${id}`;
  $("id").value = id;
  $("created").innerHTML =
    `Intent <code>${id}</code><br>Share this link with the payer:<br><a href="${link}">${link}</a>` +
    `<br><a href="${ARC.explorer}/tx/${tx.hash}" target="_blank" rel="noreferrer">See the transaction</a>`;
};

$("load").onclick = async () => {
  const id = $("id").value.trim();
  if (!id) return;
  const contract = new Contract(address, INTENTS_ABI, read);
  try {
    const [merchant, amount, payer, , , paid] = await contract.get(id);
    const line = `merchant ${merchant}\namount ${formatUnits(amount, 6)} USDC\n${paid ? `paid by ${payer}` : "not paid yet"}`;
    if (paid || !account) return show("status", line);
    const [enoughBalance, enoughAllowance] = await contract.canPay(id, account);
    show("status", `${line}\nbalance ${enoughBalance ? "ok" : "too low"} · allowance ${enoughAllowance ? "ok" : "missing"}`);
    $("approve").disabled = enoughAllowance;
    $("pay").disabled = !enoughAllowance || !enoughBalance;
  } catch {
    show("status", "No intent with that id on this contract.");
  }
};

$("approve").onclick = async () => {
  const contract = new Contract(address, INTENTS_ABI, read);
  const [, amount] = await contract.get($("id").value.trim());
  const tx = await new Contract(USDC, USDC_ABI, signer).approve(address, amount);
  show("status", `Approving… ${tx.hash}`);
  await tx.wait();
  $("approve").disabled = true;
  $("pay").disabled = false;
  show("status", "Approved. You can pay now.");
};

$("pay").onclick = async () => {
  const tx = await new Contract(address, INTENTS_ABI, signer).pay($("id").value.trim());
  show("status", `Paying… ${tx.hash}`);
  await tx.wait();
  $("status").innerHTML = `Paid. <a href="${ARC.explorer}/tx/${tx.hash}" target="_blank" rel="noreferrer">Receipt on Arc</a>`;
};

const presetId = params.get("id");
if (presetId) { $("id").value = presetId; }
</script>
</body>
</html>
